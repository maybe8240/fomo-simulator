# Replace placeholders before applying. This file does not grant public IAM access.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fomo-simulator
  annotations:
    run.googleapis.com/invoker-iam-disabled: 'false'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      serviceAccountName: fomo-runtime@YOUR_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/fomo/fomo-simulator:YOUR_TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: AI_ENABLED
              value: 'true'
            - name: CLAUDE_MODEL
              value: claude-haiku-4-5
            - name: APP_ORIGIN
              value: https://YOUR_SERVICE_HOST
            - name: APP_ACCESS_USER
              value: player
            - name: APP_ACCESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fomo-access-password
                  key: '1'
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fomo-anthropic-api-key
                  key: '1'
            - name: MAX_AI_REQUESTS_PER_DAY
              value: '100'
            - name: MAX_AI_CONCURRENT
              value: '2'
            - name: AI_REQUEST_INTERVAL_MS
              value: '3100'
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
